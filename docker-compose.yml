services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ch
    environment:
      # Zugriff aus dem internen Docker-Netz erlauben (für die Weboberfläche).
      # Kein Port nach außen freigegeben, nur dieser Rechner kommt dran.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ch_daten:/var/lib/clickhouse

  postgres:
    image: postgres:16
    container_name: pg
    environment:
      POSTGRES_PASSWORD: demo
    shm_size: 1g
    # Faire Grundeinstellungen für einen Laptop (Standardwerte sind sehr klein)
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=256MB
      -c effective_cache_size=3GB
      -c max_parallel_workers_per_gather=4
    volumes:
      - pg_daten:/var/lib/postgresql/data

  # Weboberfläche für die Live-Demo: http://localhost:8080
  ui:
    build: ./ui
    container_name: demo-ui
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./sql:/app/sql:ro
    depends_on:
      - clickhouse
      - postgres

volumes:
  ch_daten:
  pg_daten:
